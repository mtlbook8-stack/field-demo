<title>Field App — Wholesale Distributor</title>

<style>

    --primary:#1a73e8; --primary-dark:#1557b0; --primary-light:#e8f0fe;

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#1f2937;color:var(--text-primary);
    display:flex;align-items:center;justify-content:center;min-height:100vh;
  }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  /* Phone frame on desktop */
  #phone{
    position:relative;width:390px;height:844px;background:var(--bg-primary);
    border-radius:44px;box-shadow:0 0 0 12px #111,0 20px 60px rgba(0,0,0,.5);
    overflow:hidden;display:flex;flex-direction:column;
  }
  @media (max-width:430px){
    body{background:var(--bg-primary)}
    #phone{width:100vw;height:100vh;border-radius:0;box-shadow:none}
  }
  #app{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
  /* Header */
  .pheader{height:56px;flex:0 0 56px;background:#fff;border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:8px;padding:0 12px;z-index:100}
  .pheader h1{font-size:1.125rem;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .iconbtn{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;
    background:transparent;border:none;color:var(--text-secondary);cursor:pointer;flex:0 0 auto}
  .iconbtn:active{background:#f1f3f4}
  /* Scroll area */
  #scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .page{padding:16px;padding-bottom:88px;animation:fadeIn .2s}
  /* Bottom nav */
  .bnav{height:56px;flex:0 0 56px;background:#fff;border-top:1px solid var(--border);
    display:flex;align-items:center;z-index:100}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:.625rem;height:100%}
  .bnav button.active{color:var(--primary)}
  .bnav .nav-add{flex:0 0 56px;width:56px;height:48px;border-radius:999px;
    background:var(--primary);color:#fff;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(66,133,244,.5);cursor:pointer;position:relative;top:-10px;font-size:.625rem;gap:2px}
  .bnav .nav-add:active{transform:scale(.92)}
  /* legacy FAB hidden */
  .fab{display:none!important}
  /* Cards & buttons */
  .card{background:var(--bg-card);border-radius:12px;box-shadow:var(--sh-sm);padding:16px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 16px;border-radius:8px;
    border:none;font-size:.875rem;font-weight:500;cursor:pointer;transition:opacity .15s,background .15s;white-space:nowrap}
  .btn:active{opacity:.85}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-secondary{background:#fff;color:var(--primary);border:1px solid var(--primary)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-full{width:100%}
  .btn-lg{padding:16px 24px;font-size:1rem}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  /* Inputs */
  .inp{width:100%;padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:var(--bg-card);
    font-size:1rem;color:var(--text-primary);outline:none}
  .inp:focus{border-color:var(--primary)}
  textarea.inp{resize:vertical;font-family:inherit}
  /* Search chips */
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  .chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);padding:6px 12px;border-radius:20px;
    font-size:.8125rem;background:#fff;color:var(--text-secondary);cursor:pointer;white-space:nowrap}
  .chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  /* Status badge */
  .badge{display:inline-flex;align-items:center;white-space:nowrap;padding:2px 10px;border-radius:999px;
    font-size:.75rem;font-weight:600;line-height:1.4}
  .badge.sm{padding:1px 6px}
  /* Toast */
  #toast-wrap{position:absolute;top:64px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:300;pointer-events:none}
  .toast{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:8px;color:#fff;
    font-size:.875rem;font-weight:500;box-shadow:var(--sh-md);animation:slideDown .25s ease-out;pointer-events:auto;max-width:340px}
  .toast .x{width:24px;height:24px;border-radius:999px;background:rgba(255,255,255,.25);border:none;color:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
  /* Overlay & modals */
  #overlay{position:absolute;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center}
  #overlay.center{align-items:center}
  .ov-bg{position:absolute;inset:0;background:rgba(0,0,0,.5)}
  #overlay.center .ov-bg{background:rgba(0,0,0,.45)}
  .sheet{position:relative;width:100%;max-height:88%;overflow-y:auto;background:#fff;border-radius:16px 16px 0 0;
    padding:16px;animation:slideUp .25s ease-out;z-index:1}
  .dialog{position:relative;width:calc(100% - 48px);max-width:340px;background:#fff;border-radius:12px;padding:20px;
    box-shadow:var(--sh-lg);animation:fadeIn .15s;z-index:1}
  /* Misc */
  .muted{color:var(--text-muted)} .sec{color:var(--text-secondary)}
  .divide>*+*{border-top:1px solid var(--border)}
  .timeline-label{font-size:.625rem}
  .row-link:active{background:#f8f9fa}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @keyframes slideDown{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
  ::-webkit-scrollbar{width:0;height:0}
</style>
</head>

function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function ageBucket(dueDate){ // returns {label,bg,text}
  const od = daysBetween(dueDate, todayISO());

    casePrice:p.casePrice,unitPrice:p.unitPrice,depositPerCase:p.depositPerCase,discount:d,lineTotal,depositTotal};
}
function rollup(lineItems, orderDiscount){
  const subtotal=lineItems.reduce((s,l)=>s+l.casePrice*l.quantity,0);
  const lineDisc=lineItems.reduce((s,l)=>s+l.discount*l.quantity,0);
  const depositTotal=lineItems.reduce((s,l)=>s+l.depositTotal,0);
  const totalCases=lineItems.reduce((s,l)=>s+l.quantity,0);
  const od=orderDiscount||0;
  const discountTotal=lineDisc+od;
  const grandTotal=subtotal-discountTotal+depositTotal;
  return {subtotal,depositTotal,discountTotal,grandTotal,totalCases};
}

function toast(msg, variant='success'){
  const colors={success:'#1e7e34',error:'#c5221f',warning:'#d97706'};
  const ic={success:'check-circle',error:'x-circle',warning:'alert-triangle'};
  const wrap=$('#toast-wrap'); const el=document.createElement('div');
  el.className='toast'; el.style.background=colors[variant]||colors.success;
  el.innerHTML=`<i data-lucide="${ic[variant]||'check-circle'}" style="width:18px;height:18px"></i><span style="flex:1">${esc(msg)}</span><button class="x" aria-label="close"><i data-lucide="x" style="width:14px;height:14px"></i></button>`;
  el.querySelector('.x').onclick=()=>el.remove();
  wrap.appendChild(el); icons();
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .2s';setTimeout(()=>el.remove(),200);},3000);
}

const ROUTES = {}; // name -> {render, title, header, hideFab, hideNav}
function route(name, cfg){ ROUTES[name]=cfg; }

function parseHash(){
  let h=location.hash.replace(/^#/,'')||'home';
  const parts=h.split('/');
  return {base:parts[0], id:parts[1], extra:parts[2], raw:h};
}
const navState = {tab:'home'};

function render(){
  const {base,id} = parseHash();
  // Prefer an exact multi-segment route (e.g. "orders/new") over the base route ("orders")
  let cfg = (id && ROUTES[base+'/'+id]) ? ROUTES[base+'/'+id] : ROUTES[base];
  if(!cfg){ cfg=ROUTES['home']; }
  const view=$('#view');
  view.innerHTML='';
  const ctx={id, base};
  const out = cfg.render(ctx) || '';
  view.innerHTML = `<div class="page">${out}</div>`;
  renderHeader(cfg, ctx);
  renderNav(base);
  $('#scroll').scrollTop=0;
  icons();
  if(cfg.after) cfg.after(ctx);
}

function renderHeader(cfg, ctx){
  const h=$('#pheader');
  const title = typeof cfg.title==='function' ? cfg.title(ctx) : (cfg.title||'');
  const showBack = !cfg.root;
  let right='';
  if(cfg.headerRight) right=cfg.headerRight(ctx);
  h.innerHTML = `${showBack?backBtn():'<div style="width:36px"></div>'}
    <h1>${esc(title)}</h1>
    <div style="display:flex;gap:8px;align-items:center">${right}</div>`;
  icons();
}

function renderNav(base){
  const nav=$('#bnav');
  const first = state.role==='Driver' ? {id:'route',label:'Route',icon:'truck',hash:'#route'} : {id:'home',label:'Home',icon:'home',hash:'#home'};
  const left=[first, {id:'customers',label:'Customers',icon:'users',hash:'#customers'}];
  const right=[{id:'orders',label:'Orders',icon:'shopping-bag',hash:'#orders'},{id:'pay',label:'Pay',icon:'dollar-sign',hash:'#payments'}];
  const activeMap={home:'home',route:'route',customers:'customers',orders:'orders',payments:'pay'};
  const active=activeMap[base]||'';
  const tab=t=>`<button class="${active===t.id?'active':''}" onclick="location.hash='${t.hash}'">
    <i data-lucide="${t.icon}" style="width:22px;height:22px"></i><span>${t.label}</span></button>`;
  nav.innerHTML = left.map(tab).join('')+
    `<button class="nav-add" onclick="location.hash='#orders/new'"><i data-lucide="plus" style="width:24px;height:24px"></i></button>`+
    right.map(tab).join('');
  icons();
}

const custFilter={q:'',chip:'All',sort:'az',dir:'asc',types:new Set(),regions:new Set()};
const CUST_TYPES=[...new Set(CUSTOMERS.map(c=>c.type))].sort();
const CUST_REGIONS=[...new Set(CUSTOMERS.map(c=>c.route))].sort();
function custMatchesChip(c){
  switch(custFilter.chip){
    case 'Active': return c.status==='Active';
    case 'Hold': return c.status==='Hold';
    case 'Overdue': return INVOICES.some(i=>i.customerId===c.id && i.status==='Overdue');
    case 'Prepaid': return c.paymentType==='prepaid';
    case 'Credit': return c.paymentType==='credit';
    default: return true;
  }
}
function applyCustFilters(){
  const q=custFilter.q.toLowerCase();
  const d=custFilter.dir==='asc'?1:-1;
  let list=CUSTOMERS.filter(custMatchesChip)
    .filter(c=>!custFilter.types.size||custFilter.types.has(c.type))
    .filter(c=>!custFilter.regions.size||custFilter.regions.has(c.route))
    .filter(c=>!q||c.name.toLowerCase().includes(q)||c.code.toLowerCase().includes(q)||c.address.toLowerCase().includes(q));
  switch(custFilter.sort){
    case 'balance':   list.sort((a,b)=>d*(a.balance-b.balance)); break;
    case 'lastorder': list.sort((a,b)=>d*(a.lastOrderDate||'').localeCompare(b.lastOrderDate||'')); break;
    case 'frequency': list.sort((a,b)=>d*(a.avgOrderCases-b.avgOrderCases)); break;
    case 'region':    list.sort((a,b)=>d*a.route.localeCompare(b.route)); break;
    case 'proximity': list.sort((a,b)=>d*a.route.localeCompare(b.route)); break;
    default:          list.sort((a,b)=>d*a.name.localeCompare(b.name));
  }
  return list;
}
function custActiveFilterCount(){ return custFilter.types.size+(state.role==='Driver'?custFilter.regions.size:0); }

      <div style="display:flex;gap:8px;align-items:center">
        ${fc?`<button class="btn btn-secondary" style="padding:4px 10px;font-size:.8rem" onclick="custFilter.types.clear();custFilter.regions.clear();closeOverlay();render()">Clear all</button>`:''}

    </div>

    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:${isDriver?16:20}px">
      ${CUST_TYPES.map(t=>`<button id="ft_${t}" class="chip ${custFilter.types.has(t)?'active':''}" onclick="custFilter.types.has('${t}')?custFilter.types.delete('${t}'):custFilter.types.add('${t}');this.classList.toggle('active')">${t}</button>`).join('')}
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px">
      ${CUST_REGIONS.map(r=>`<button class="chip ${custFilter.regions.has(r)?'active':''}" onclick="custFilter.regions.has('${r}')?custFilter.regions.delete('${r}'):custFilter.regions.add('${r}');this.classList.toggle('active')">${esc(r)}</button>`).join('')}

    <button class="btn btn-primary btn-full btn-lg" onclick="closeOverlay();render()">Apply Filters${custActiveFilterCount()?` (${custActiveFilterCount()})`:''}</button>`);

function customerProfile(id){
  const c=CUST(id); if(!c) return empty('user','Customer not found','');
  const parent=c.isBranch?CUST(c.parentId):null;
  const tabs=[['Overview','user'],['Orders','shopping-bag'],['Invoices','file-text'],['Payments','wallet'],['Statement','scroll'],['Account','credit-card'],['Branches','git-branch'],['Notes','sticky-note']]
    .filter(t=>!(t[0]==='Branches'&&c.isBranch));
  if(profileTab==='Branches'&&c.isBranch) profileTab='Overview';
  const crumb = c.isBranch
    ? `<span class="row-link" onclick="location.hash='#customers'">Customers</span> › <span class="row-link" onclick="location.hash='#customers/${parent.id}'">${esc(parent.name)}</span> › ${esc(c.name)}`
    : `<span class="row-link" onclick="location.hash='#customers'">Customers</span> › ${esc(c.name)}`;
  const action=(emoji,label,onclick)=>`<button class="btn btn-secondary" style="flex-direction:column;gap:2px;min-width:64px;padding:8px;font-size:.7rem" onclick="${onclick}"><span style="font-size:1.1rem">${emoji}</span>${label}</button>`;
  return `
  <div class="muted" style="font-size:.75rem;margin-bottom:8px">${crumb}</div>
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">${statusBadge(c.status)}<span class="muted" style="font-size:.8rem">${esc(c.type)}</span></div>
  <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:8px">
    ${action('➕','New Order',`startNewOrder('${c.id}')`)}
    ${action('💲','Payment',`startPayment('${c.id}')`)}
    ${action('✉️','Message',`openSendMessage('${c.id}')`)}
    ${action('📞','Call',`location.href='tel:${c.phone}'`)}
    ${action('✏️','Edit',`toast('Edit customer (mock)')`)}

  <div class="chips" style="margin:12px 0;border-bottom:1px solid var(--border)">
    ${tabs.map(t=>`<button onclick="profileTab='${t[0]}';render()" style="background:none;border:none;padding:8px 10px;font-size:.85rem;cursor:pointer;border-bottom:2px solid ${profileTab===t[0]?'var(--primary)':'transparent'};color:${profileTab===t[0]?'var(--primary)':'var(--text-secondary)'};font-weight:${profileTab===t[0]?600:400}">${t[0]}</button>`).join('')}

function profileTabBody(c){
  if(profileTab==='Overview') return overviewTab(c);
  if(profileTab==='Orders'){ const list=ORDERS.filter(o=>o.customerId===c.id).sort((a,b)=>b.createdDate.localeCompare(a.createdDate));
    return list.length?list.map(o=>`<div class="card row-link" style="margin-bottom:8px;cursor:pointer" onclick="location.hash='#orders/${o.id}'">
      <div style="display:flex;justify-content:space-between"><span class="mono" style="font-weight:600">${o.orderNumber}</span>${statusBadge(o.status)}</div>
      <div class="muted" style="font-size:.8rem;margin-top:4px">${fmtDate(o.createdDate)} · ${o.totalCases} cases · ${money(o.grandTotal)}</div></div>`).join(''):empty('shopping-bag','No orders yet','');
  }
  if(profileTab==='Invoices') return invoicesTab(c);
  if(profileTab==='Payments') return paymentsTab(c);
  if(profileTab==='Statement') return statementTab(c);
  if(profileTab==='Account') return accountTab(c);
  if(profileTab==='Branches'){ const branches=CUSTOMERS.filter(b=>b.parentId===c.id);
    return `${branches.length?branches.map(b=>`<div class="card row-link" style="margin-bottom:8px;cursor:pointer" onclick="location.hash='#customers/${b.id}'">
      <div style="font-weight:600">${esc(b.name)}</div><div class="muted" style="font-size:.8rem">${esc(b.address)}</div></div>`).join(''):empty('git-branch','No branch locations yet','')}
      <button class="btn btn-secondary btn-full" style="margin-top:8px" onclick="openAddBranch('${c.id}')"><i data-lucide="plus"></i>Add Branch</button>`;
  }
  if(profileTab==='Notes') return notesTab(c);
  return '';
}

  const recentOrders=ORDERS.filter(o=>o.customerId===c.id).sort((a,b)=>b.createdDate.localeCompare(a.createdDate)).slice(0,3);
  const openInv=INVOICES.filter(i=>i.customerId===c.id&&i.status!=='Paid').sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,3);
  const infoRow=(k,v)=>`<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:.875rem"><span class="muted">${k}</span><span style="text-align:right">${v}</span></div>`;
  return `
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div class="card"><div class="muted" style="font-size:.75rem">Balance</div><div style="font-size:1.3rem;font-weight:700;color:${c.balance>0?'var(--danger)':'var(--success)'}">${money(c.balance)}</div></div>
    ${c.paymentType==='credit'?`<div class="card"><div class="muted" style="font-size:.75rem">Credit Limit</div><div style="font-size:1.3rem;font-weight:700">${money(c.creditLimit)}</div></div>`:''}
    ${c.accountCredit>0?`<div class="card"><div class="muted" style="font-size:.75rem">Unapplied Credit</div><div style="font-size:1.3rem;font-weight:700;color:var(--success)">${money(c.accountCredit)}</div></div>`:''}
  </div>
  ${c.paymentType==='credit'?`<div class="card" style="margin-top:10px">
    <div style="font-size:.8rem;font-weight:500;margin-bottom:4px">Credit Usage</div>${creditBar(c.balance,c.creditLimit)}

const stmtState={from:'',to:'',type:'open_balance',preset:''};
function stmtSetPreset(key){
  const today=todayISO();
  const d=n=>{ const dt=new Date('2026-06-04'); dt.setDate(dt.getDate()+n); return dt.toISOString().slice(0,10); };
  stmtState.preset=key;
  switch(key){
    case '30d':  stmtState.from=d(-30);  stmtState.to=today; break;
    case '60d':  stmtState.from=d(-60);  stmtState.to=today; break;
    case '90d':  stmtState.from=d(-90);  stmtState.to=today; break;
    case 'mtd':  stmtState.from='2026-06-01'; stmtState.to=today; break;
    case 'lm':   stmtState.from='2026-05-01'; stmtState.to='2026-05-31'; break;
    case 'ytd':  stmtState.from='2026-01-01'; stmtState.to=today; break;
    case 'ly':   stmtState.from='2025-01-01'; stmtState.to='2025-12-31'; break;
  }
  render();
}
function statementTab(c){
  // default preset: This Month
  if(!stmtState.from){ stmtState.preset='mtd'; stmtState.from='2026-06-01'; stmtState.to=todayISO(); }
  const invAll=INVOICES.filter(i=>i.customerId===c.id);
  const payAll=PAYMENTS.filter(p=>p.customerId===c.id);
  // filter by range
  const inRange=d=>d>=stmtState.from&&d<=stmtState.to;
  let lines=[];
  if(stmtState.type==='open_balance'){
    // open balance: unpaid/partial invoices (any date) + payments with unapplied amount
    invAll.filter(i=>i.status!=='Paid').forEach(i=>
      lines.push({date:i.createdDate||i.dueDate,ref:i.invoiceNumber,desc:'Invoice — '+statusBadge(i.status),debit:i.grandTotal,credit:i.amountPaid||0,balance:i.amountDue,status:i.status}));
    payAll.filter(p=>p.unappliedAmount>0).forEach(p=>
      lines.push({date:p.date,ref:p.reference||'—',desc:'Unallocated Payment ('+p.method+')',debit:0,credit:p.unappliedAmount,balance:0,status:'Open'}));
    lines.sort((a,b)=>a.date.localeCompare(b.date));
  } else {
    // all transactions: every invoice + every payment within date range
    invAll.filter(i=>inRange(i.createdDate||i.dueDate)).forEach(i=>
      lines.push({date:i.createdDate||i.dueDate,ref:i.invoiceNumber,desc:'Invoice',debit:i.grandTotal,credit:i.amountPaid||0,balance:i.amountDue,status:i.status}));
    payAll.filter(p=>inRange(p.date)).forEach(p=>
      lines.push({date:p.date,ref:p.reference||'—',desc:'Payment ('+p.method+')'+(p.unappliedAmount>0?' · '+money(p.unappliedAmount)+' unallocated':''),debit:0,credit:p.amount,balance:p.unappliedAmount,status:p.unappliedAmount>0?'Open':'Paid'}));
    lines.sort((a,b)=>a.date.localeCompare(b.date));
  }
  const totalDebit=lines.reduce((s,l)=>s+l.debit,0);
  const totalCredit=lines.reduce((s,l)=>s+l.credit,0);
  const netDue=totalDebit-totalCredit;

  return `

      </div>

        <div class="muted" style="font-size:.75rem;margin-bottom:4px">To</div>
        <input class="inp" type="date" value="${stmtState.to}" onchange="stmtState.to=this.value;stmtState.preset='custom';render()" style="padding:6px 8px;font-size:.85rem"/>
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn ${stmtState.type==='open_balance'?'btn-primary':'btn-secondary'}" style="flex:1;padding:8px" onclick="stmtState.type='open_balance';render()">Open Balance</button>
      <button class="btn ${stmtState.type==='all_transactions'?'btn-primary':'btn-secondary'}" style="flex:1;padding:8px" onclick="stmtState.type='all_transactions';render()">All Transactions</button>
    </div>
  </div>
  ${lines.length?`
  <div class="card" style="margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="font-weight:600">${esc(c.name)}</div>
      <div class="muted" style="font-size:.75rem">${stmtState.type==='open_balance'?'Open Balance':'Transactions '+fmtDate(stmtState.from)+' – '+fmtDate(stmtState.to)}</div>
    </div>
    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:.78rem">
        <thead><tr style="border-bottom:2px solid var(--border)">
          <th style="text-align:left;padding:4px 4px 6px;color:var(--text-secondary);font-weight:500">Date</th>

          <th style="text-align:right;padding:4px 4px 6px;color:var(--text-secondary);font-weight:500">Status</th>
        </tr></thead>
        <tbody>
          ${lines.map(l=>`<tr style="border-bottom:1px solid var(--border)">
            <td style="padding:5px 4px">${fmtDate(l.date)}</td>
            <td style="padding:5px 4px;font-family:monospace">${esc(l.ref)}<div class="muted" style="font-size:.7rem">${esc(l.desc)}</div></td>
            <td style="padding:5px 4px;text-align:right">${l.debit?money(l.debit):'—'}</td>
            <td style="padding:5px 4px;text-align:right;color:var(--success)">${l.credit?money(l.credit):'—'}</td>
            <td style="padding:5px 4px;text-align:right">${statusBadge(l.status)}</td>
          </tr>`).join('')}
          <tr style="border-top:2px solid var(--border);font-weight:700">
            <td colspan="2" style="padding:6px 4px">Total Due</td>
            <td style="padding:6px 4px;text-align:right">${money(totalDebit)}</td>
            <td style="padding:6px 4px;text-align:right;color:var(--success)">${money(totalCredit)}</td>
            <td style="padding:6px 4px;text-align:right;color:${netDue>0?'var(--danger)':'var(--success)'}">${money(netDue)}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <div style="display:flex;gap:8px">
    <button class="btn btn-secondary" style="flex:1" onclick="toast('Printing statement…')"><i data-lucide="printer"></i> Print</button>
    <button class="btn btn-primary" style="flex:1" onclick="openSendMessage('${c.id}',true)"><i data-lucide="send"></i> Send</button>
  </div>`:empty('scroll','No transactions','Adjust the date range or type.')}`;
}

const payScreen={customerId:null,q:'',tab:'Invoices',selected:new Set()};

function paymentPickCustomer(){

function paymentSelected(){ const c=CUST(payScreen.customerId);
  const invoices=INVOICES.filter(i=>i.customerId===c.id&&i.status!=='Paid');
  const orders=ORDERS.filter(o=>o.customerId===c.id&&['Delivered'].includes(o.status)&&!INVOICES.some(i=>i.orderId===o.id&&i.status==='Paid'));
  const items = payScreen.tab==='Invoices'?invoices:orders;
  const selTotal=[...payScreen.selected].reduce((s,id)=>{ const inv=INV(id); if(inv)return s+inv.amountDue; const o=ORD(id); return s+(o?o.grandTotal:0); },0);
  const row=(item,isInv)=>{ const id=item.id; const sel=payScreen.selected.has(id); const num=isInv?item.invoiceNumber:item.orderNumber; const bal=isInv?item.amountDue:item.grandTotal; const dt=isInv?('due '+fmtDate(item.dueDate)):fmtDate(item.createdDate);

        <div class="muted" style="font-size:.75rem">${dt} · ${money(bal)}</div></div>
      ${c.accountCredit>0?`<button class="btn btn-secondary" style="padding:4px 8px;font-size:.72rem" onclick="useCreditOn('${id}')">Use Credit</button>`:''}</div>`;};
  return `<div class="card" style="display:flex;justify-content:space-between;align-items:center">
      <div><div style="font-weight:600">${esc(c.name)}</div><div class="muted" style="font-size:.8rem">Balance ${money(c.balance)}</div></div>
      <button class="btn btn-secondary" onclick="payScreen.customerId=null;render()">Change</button></div>
    ${c.accountCredit>0?`<div class="card" style="margin-top:10px;background:#dcfce7;color:#166534;display:flex;justify-content:space-between;align-items:center">
      <span>💰 Account Credit: ${money(c.accountCredit)}</span><button class="btn btn-primary" style="padding:6px 10px;font-size:.75rem" onclick="justCollectCredit('${c.id}')">Just Collect Payment</button></div>`:''}
    <div style="display:flex;gap:6px;margin-top:12px">
      <button class="btn ${payScreen.tab==='Orders'?'btn-primary':'btn-secondary'} btn-full" onclick="payScreen.tab='Orders';payScreen.selected=new Set();render()">Orders (${orders.length})</button>
      <button class="btn ${payScreen.tab==='Invoices'?'btn-primary':'btn-secondary'} btn-full" onclick="payScreen.tab='Invoices';payScreen.selected=new Set();render()">Invoices (${invoices.length})</button></div>
    <div style="margin-top:12px">${items.length?`<button class="btn btn-secondary" style="padding:4px 10px;font-size:.75rem;margin-bottom:8px" onclick="selectAllPay()">Select All</button>`:''}
      ${items.length?items.map(it=>row(it,payScreen.tab==='Invoices')).join(''):`<div class="card" style="text-align:center;padding:20px"><div style="font-size:1.4rem;margin-bottom:6px;color:#16a34a">✓</div><div style="font-weight:600;font-size:.9rem">No outstanding ${payScreen.tab.toLowerCase()}</div><div class="muted" style="font-size:.8rem;margin-top:4px">Collect a payment to apply as account credit</div></div>`}</div>
    <div style="position:absolute;left:0;right:0;bottom:56px;background:#fff;border-top:1px solid var(--border);padding:10px 16px;display:flex;justify-content:space-between;align-items:center">
      <span style="font-weight:600">Selected total: ${money(selTotal)}</span>
      <button class="btn btn-primary" onclick="openPayForSelection()">${selTotal>0?'Collect '+money(selTotal):'Collect Custom Amt'}</button></div>`;
}
function togglePaySel(id){ if(payScreen.selected.has(id))payScreen.selected.delete(id); else payScreen.selected.add(id); render(); }
function selectAllPay(){ const c=CUST(payScreen.customerId);
  const items=payScreen.tab==='Invoices'?INVOICES.filter(i=>i.customerId===c.id&&i.status!=='Paid'):ORDERS.filter(o=>o.customerId===c.id&&o.status==='Delivered');
  items.forEach(i=>payScreen.selected.add(i.id)); render(); }
function openPayForSelection(){ const c=CUST(payScreen.customerId);
  const selTotal=[...payScreen.selected].reduce((s,id)=>{ const inv=INV(id); if(inv)return s+inv.amountDue; const o=ORD(id); return s+(o?o.grandTotal:0); },0);
  if(selTotal===0){ justCollectCredit(c.id); return; }
  const applyTo=[...payScreen.selected].filter(id=>INV(id)).map(id=>({invoiceId:id,amount:INV(id).amountDue}));
  paymentModal({customerId:c.id,amount:selTotal,context:`${payScreen.selected.size} ${payScreen.tab.toLowerCase()} (partial payment allowed)`,apply:true,
    onSuccess:()=>{
      const paid=payModalState.amount;
      const ratio=selTotal>0?Math.min(paid/selTotal,1):0;
      applyTo.forEach(a=>{ const inv=INV(a.invoiceId); if(!inv)return;
        const applyAmt=+(a.amount*ratio).toFixed(2);
        inv.amountPaid=+(inv.amountPaid+applyAmt).toFixed(2);
        inv.amountDue=Math.max(0,+(inv.grandTotal-inv.amountPaid).toFixed(2));
        recomputeInvoiceStatus(inv); });
      payScreen.selected=new Set(); render(); }});
  payModalState.applyTo=applyTo;
}
function useCreditOn(id){ const c=CUST(payScreen.customerId); const inv=INV(id); const amt=Math.min(c.accountCredit, inv?inv.amountDue:ORD(id).grandTotal);
  c.accountCredit-=amt; if(inv){inv.amountPaid+=amt;inv.amountDue=Math.max(0,inv.grandTotal-inv.amountPaid);recomputeInvoiceStatus(inv);} toast(`Applied ${money(amt)} account credit`); render(); }
function justCollectCredit(cid){ paymentModal({customerId:cid,amount:0,context:'Account Credit',onSuccess:()=>{ CUST(cid).accountCredit+=payModalState.amount; render(); }}); payModalState.method='Account Credit'; }

const RPT_BUCKETS=[{key:'current',label:'Current',bg:'#dcfce7',text:'#166534'},{key:'1-30',label:'1–30',bg:'#fef9c3',text:'#854d0e'},{key:'31-60',label:'31–60',bg:'#ffedd5',text:'#9a3412'},{key:'61-90',label:'61–90',bg:'#fee2e2',text:'#991b1b'},{key:'90+',label:'90+',bg:'#f3e8ff',text:'#6b21a8'}];
const rptState={q:'',chip:'All',sort:'balance',dir:'desc',types:new Set(),selectedIds:new Set(),activeBuckets:new Set(['current','1-30','31-60','61-90','90+']),breakdown:'balance',built:false,reportData:[]};
const RPT_BREAKDOWNS=[{key:'balance',label:'Balance Only',sub:'Net amount due'},{key:'open',label:'Open Transactions',sub:'Unpaid invoices'},{key:'all',label:'All Transactions',sub:'Every invoice'}];
function rptSortCustomers(arr){
  const d=rptState.dir==='asc'?1:-1;
  const a2=[...arr];
  switch(rptState.sort){
    case 'az':        a2.sort((a,b)=>d*a.customer.name.localeCompare(b.customer.name)); break;
    case 'lastorder': a2.sort((a,b)=>d*((a.customer.lastOrderDate||'').localeCompare(b.customer.lastOrderDate||''))); break;
    case 'frequency': a2.sort((a,b)=>d*((a.customer.avgOrderCases||0)-(b.customer.avgOrderCases||0))); break;
    default:          a2.sort((a,b)=>d*(a.netBalance-b.netBalance));
  }
  return a2;
}

function rptBucketKey(dueDate){ const d=daysBetween(dueDate,todayISO()); if(d<=0)return'current'; if(d<=30)return'1-30'; if(d<=60)return'31-60'; if(d<=90)return'61-90'; return'90+'; }
function rptCustMatchesChip(c){
  switch(rptState.chip){
    case 'Active': return c.status==='Active';
    case 'Hold': return c.status==='Hold';
    case 'Overdue': return INVOICES.some(i=>i.customerId===c.id && i.status==='Overdue');
    case 'Prepaid': return c.paymentType==='prepaid';
    case 'Credit': return c.paymentType==='credit';
    default: return true;
  }
}
function rptFilteredCustomers(){
  const q=rptState.q.toLowerCase();
  const d=rptState.dir==='asc'?1:-1;
  let list=CUSTOMERS.filter(rptCustMatchesChip)
    .filter(c=>!rptState.types.size||rptState.types.has(c.type))
    .filter(c=>!q||c.name.toLowerCase().includes(q)||c.code.toLowerCase().includes(q)||(c.address||'').toLowerCase().includes(q));
  switch(rptState.sort){
    case 'balance':   list.sort((a,b)=>d*(a.balance-b.balance)); break;
    case 'lastorder': list.sort((a,b)=>d*((a.lastOrderDate||'').localeCompare(b.lastOrderDate||''))); break;
    case 'frequency': list.sort((a,b)=>d*((a.avgOrderCases||0)-(b.avgOrderCases||0))); break;
    default:          list.sort((a,b)=>d*a.name.localeCompare(b.name));
  }
  return list;
}
function rptActiveFilterCount(){ return rptState.types.size; }
function rptToggleCust(id){ rptState.selectedIds.has(id)?rptState.selectedIds.delete(id):rptState.selectedIds.add(id); render(); }

function rptBuild(){
  const selected=CUSTOMERS.filter(c=>rptState.selectedIds.has(c.id));
  rptState.reportData=selected.map(customer=>{
    const allInv=INVOICES.filter(i=>i.customerId===customer.id).map(inv=>({...inv,daysOverdue:Math.max(0,daysBetween(inv.dueDate,todayISO())),bucketKey:rptBucketKey(inv.dueDate)}));
    const openInv=allInv.filter(i=>i.status!=='Paid');
    const buckets={current:{invoices:[],total:0},'1-30':{invoices:[],total:0},'31-60':{invoices:[],total:0},'61-90':{invoices:[],total:0},'90+':{invoices:[],total:0}};
    openInv.forEach(inv=>{ buckets[inv.bucketKey].invoices.push({...inv,balance:inv.amountDue}); buckets[inv.bucketKey].total+=inv.amountDue; });
    const totalBalance=Object.values(buckets).reduce((s,b)=>s+b.total,0);
    const credit=customer.accountCredit||0;
    return {customer,buckets,allInvoices:allInv.sort((a,b)=>b.createdDate.localeCompare(a.createdDate)),openInvoices:openInv.sort((a,b)=>a.dueDate.localeCompare(b.dueDate)),totalBalance,accountCredit:credit,netBalance:totalBalance-credit};
  }).filter(r=>r.totalBalance>0||rptState.breakdown==='all');
  rptState.built=true; render();
}
function rptExport(){
  const {reportData,activeBuckets,breakdown}=rptState;
  if(!reportData.length){toast('No data to export','warning');return;}
  let csv='';
  if(breakdown==='balance'){
    csv='Customer,Contact,Phone,Email,Address,Current,1-30,31-60,61-90,90+,Gross Balance,Account Credit,Net Balance\n';
    rptSortCustomers(reportData).forEach(({customer,buckets,totalBalance,accountCredit,netBalance})=>{
      const t=k=>(activeBuckets.has(k)?buckets[k].total.toFixed(2):'0.00');
      csv+=`"${customer.name}","${customer.contact||''}","${customer.phone||''}","${customer.email||''}","${customer.address||''}",${t('current')},${t('1-30')},${t('31-60')},${t('61-90')},${t('90+')},${totalBalance.toFixed(2)},${accountCredit.toFixed(2)},${netBalance.toFixed(2)}\n`;
    });
  } else {
    csv='Customer,Contact,Phone,Email,Address,Invoice #,Status,Created,Due Date,Days Overdue,Bucket,Invoice Total,Amt Paid,Balance\n';
    rptSortCustomers(reportData).forEach(({customer})=>{
      const txns=breakdown==='all'?reportData.find(r=>r.customer.id===customer.id).allInvoices:reportData.find(r=>r.customer.id===customer.id).openInvoices;
      txns.filter(inv=>activeBuckets.has(inv.bucketKey)||inv.status==='Paid').forEach(inv=>{
        const bktLabel=(RPT_BUCKETS.find(b=>b.key===inv.bucketKey)||{label:''}).label;
        csv+=`"${customer.name}","${customer.contact||''}","${customer.phone||''}","${customer.email||''}","${customer.address||''}","${inv.invoiceNumber}","${inv.status}","${inv.createdDate.slice(0,10)}","${inv.dueDate}",${inv.daysOverdue},"${bktLabel}",${inv.grandTotal.toFixed(2)},${inv.amountPaid.toFixed(2)},${inv.amountDue.toFixed(2)}\n`;
      });
    });
  }
  const a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);
  a.download='balance-report-'+todayISO()+'.csv'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast('CSV downloaded');
}

  <div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-secondary btn-full" onclick="clearSig()">Clear</button><button class="btn btn-primary btn-full" onclick="saveSig('${id}')">Save & Confirm</button></div>`);

function initSig(){ const cv=$('#sigCanvas'); if(!cv)return; const ctx=cv.getContext('2d'); ctx.lineWidth=2; ctx.lineCap='round'; ctx.strokeStyle='#202124'; let drawing=false;
  const pos=e=>{ const r=cv.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:(t.clientX-r.left)*(cv.width/r.width),y:(t.clientY-r.top)*(cv.height/r.height)}; };
  const start=e=>{drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault();};
  const move=e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault();};
  const end=()=>{drawing=false;};
  cv.addEventListener('mousedown',start);cv.addEventListener('mousemove',move);window.addEventListener('mouseup',end);
  cv.addEventListener('touchstart',start);cv.addEventListener('touchmove',move);cv.addEventListener('touchend',end); }
function clearSig(){ const cv=$('#sigCanvas'); if(cv)cv.getContext('2d').clearRect(0,0,cv.width,cv.height); }
function saveSig(id){ const s=STOP(id); s.status='Delivered'; const o=ORD(s.orderId); o.status='Delivered';
  if(!INVOICES.some(i=>i.orderId===o.id)){ const inv=makeInvoice({id:uid('i'),invoiceNumber:'INV-'+todayISO().replace(/-/g,'')+'-'+String(INVOICES.length+1).padStart(3,'0'),orderId:o.id,customerId:o.customerId,status:'Open',lineItems:o.lineItems,amountPaid:0,dueDate:nextWorkingDay(),createdDate:todayISO(),paidDate:null}); INVOICES.push(inv); }
  closeOverlay(); toast('Delivered — invoice created'); render(); }
function openRefuse(id){ openSheet(`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0">Refuse Delivery</h3><button class="iconbtn" onclick="closeOverlay()"><i data-lucide="x"></i></button></div>
  <div style="font-size:.8rem;margin-bottom:6px">Reason</div><select class="inp" id="refReason">${REFUSE_REASONS.map(r=>`<option>${r}</option>`).join('')}</select>
  <button class="btn btn-danger btn-full" style="margin-top:12px" onclick="doRefuse('${id}')">Confirm Refusal</button>`); }
function doRefuse(id){ const s=STOP(id); s.status='Refused'; s.refuseReason=$('#refReason').value; closeOverlay(); toast('Delivery refused','warning'); render(); }

/* ===================== INIT ===================== */
if(!location.hash) location.hash='#home';
render();
</script>
